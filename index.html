<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Card Karyawan Timas</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- <iframe src="https://script.google.com/a/~/macros/s/AKfycbyeP97khgj8h9ZwS2hzVcwZMDgAe1OgeAP8hPae-QoAhI3KgHgw7vyYE-iEUj-LCL-26g/exec"></iframe> -->

 <div style="text-align: center; font-family: 'Segoe UI', Roboto, sans-serif; padding: 40px 20px;">
    
    <!-- TANDA GAWAT DARURAT (Emergency Warning Sign) -->
    <div class="emergency-box">
        <div class="warning-icon">⚠</div>
        <span class="warning-text">SYSTEM STATUS: MAINTENANCE</span>
    </div>

    <!-- TEKS UTAMA (Fresh Neon Gradient) -->
    <h1 style="
        font-size: 3.5rem;
        font-weight: 900;
        margin: 20px 0 10px;
        background: linear-gradient(45deg, #00ff87, #60efff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        letter-spacing: 4px;
        animation: pulse-glow 2s infinite ease-in-out;
    ">
        Web Sedang Diproses
    </h1>

    <!-- ANIMASI LOOPING (Komputer Panik + Lampu Sirine) -->
    <div class="funny-loader">
        <div class="siren-light"></div>
        <div class="monitor">
            <div class="code-line"></div>
            <div class="code-line"></div>
            <div class="code-line"></div>
        </div>
        <div class="keyboard"></div>
    </div>
    
    <p style="color: #cbd5e1; font-size: 1.1rem; letter-spacing: 1px; margin-top: 15px; font-weight: 500;">
        Terjadi pembaruan massal! Tim developer sedang mengendalikan situasi ☕⚡
    </p>
</div>

<!-- ================= STYLE & ANIMASI (LOOPING) ================= -->
<style>
/* Container Tanda Gawat Darurat */
.emergency-box {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 71, 87, 0.1);
    border: 2px solid #ff4757;
    padding: 8px 20px;
    border-radius: 30px;
    box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
    animation: blink-border 1s infinite alternate;
}

.warning-icon {
    color: #ff4757;
    font-size: 1.4rem;
    font-weight: bold;
    animation: vibrate 0.2s infinite;
}

.warning-text {
    color: #ff4757;
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 2px;
}

/* Animasi Berdenyut untuk Teks Utama */
@keyframes pulse-glow {
    0%, 100% { transform: scale(0.98); filter: drop-shadow(0 0 10px rgba(0, 255, 135, 0.3)); }
    50% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(96, 239, 255, 0.7)); }
}

/* Container Animasi Lucu */
.funny-loader {
    display: inline-block;
    margin: 40px auto 20px;
    position: relative;
    animation: bounce 0.5s infinite alternate ease-in-out;
}

/* Lampu Emergency Sirine Mini di Atas Komputer */
.siren-light {
    width: 14px;
    height: 10px;
    background: #ff4757;
    border-radius: 10px 10px 0 0;
    margin: 0 auto -2px;
    box-shadow: 0 0 20px #ff4757;
    animation: siren-flash 0.4s infinite alternate;
}

/* Desain Monitor Fresh Cyberpunk */
.monitor {
    width: 65px;
    height: 48px;
    background: #0f172a;
    border: 3px solid #00ff87;
    border-radius: 8px;
    padding: 6px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 5px;
    box-shadow: 0 0 20px rgba(0, 255, 135, 0.3);
}

/* Baris Kode di Dalam Monitor */
.code-line {
    height: 4px;
    background: #60efff;
    border-radius: 2px;
    width: 0;
    animation: writeCode 1.2s infinite linear;
}
.code-line:nth-child(2) { animation-delay: 0.2s; background: #ff4757; }
.code-line:nth-child(3) { animation-delay: 0.4s; width: 50%; background: #00ff87; }

/* Desain Keyboard */
.keyboard {
    width: 44px;
    height: 6px;
    background: #00ff87;
    margin: 4px auto 0;
    border-radius: 0 0 4px 4px;
    position: relative;
}
.keyboard::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 19px;
    width: 6px;
    height: 4px;
    background: #00ff87;
}

/* ================= KEYFRAMES ANIMASI ================= */

/* Border Kotak Gawat Darurat Berkedip */
@keyframes blink-border {
    from { border-color: #ff4757; box-shadow: 0 0 5px rgba(255, 71, 87, 0.2); }
    to { border-color: #ff6b81; box-shadow: 0 0 20px rgba(255, 71, 87, 0.6); background: rgba(255, 71, 87, 0.2); }
}

/* Tanda Seru Bergetar */
@keyframes vibrate {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-1px, 1px); }
    40% { transform: translate(-1px, -1px); }
    60% { transform: translate(1px, 1px); }
    80% { transform: translate(1px, -1px); }
    100% { transform: translate(0, 0); }
}

/* Sirine Berkedip Cepat */
@keyframes siren-flash {
    from { background: #ff4757; box-shadow: 0 0 5px #ff4757; }
    to { background: #ff0000; box-shadow: 0 0 25px #ff0000, 0 0 40px #ff4757; }
}

/* Komputer Melompat */
@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-12px); }
}

/* Mengetik Kode */
@keyframes writeCode {
    0% { width: 0%; }
    50% { width: 100%; }
    100% { width: 0%; }
}
</style>

</body>
</html>
