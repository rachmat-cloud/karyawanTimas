<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5c36">
<title>ID Card</title>
<style>
html,body{margin:0;height:100%;background:#f3f5f7;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f7}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#6b7280;font-size:14px;text-align:center;padding:20px}
#ld.hide{display:none}
.spn{width:34px;height:34px;border:4px solid #cfe5d9;border-top-color:#0a5c36;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#err{display:none;color:#b30000;font-weight:700;line-height:1.5}
#err button{margin-top:10px;font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:#0a5c36;color:#fff;cursor:pointer}
</style>
</head>
<body>

<div id="ld">
  <div class="spn" id="spn"></div>
  <div id="msg">Memuat data...</div>
  <div id="err">Tidak dapat memuat aplikasi.<br><button onclick="location.reload()">Coba lagi</button></div>
</div>
<iframe id="app" title="ID Card" allow="clipboard-write; fullscreen"></iframe>

<script>
/* ============ ISI BAGIAN INI ============ */

/* WAJIB (sekali): URL Web app dari Apps Script (Deploy > Manage deployments), berakhiran /exec.
   Bentuknya: https://script.google.com/macros/s/XXXX/exec  (TANPA /a/~/ atau /a/domain/) */
var GAS_URL = "https://script.google.com/macros/s/AKfycbyXtCULjDXFneXGN2af7rl-QDTSNSQHlRPblZvYA_yTigourWlriFGV7Jncg_QxLRvH2g/exec";

/* OPSIONAL (hanya jika suatu hari kamu membuat deployment BARU dan ingin GitHub ikut otomatis):
   link CSV dari tab "Config" (File > Share > Publish to web > tab Config > CSV).
   Kosongkan "" kalau tidak dipakai. */
var CSV_URL = "";

/* ============ SELESAI ============ */

function withTimeout(p, ms) {
  return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, ms); })]);
}
function fromCsv() {
  var u = CSV_URL + (CSV_URL.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now();
  return withTimeout(fetch(u, { cache: "no-store" }), 8000)
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
    .then(function (t) {
      var m = t.match(/https:\/\/script\.google\.com\/[^\s",]+/);
      if (!m) throw new Error("url tidak ada");
      return m[0];
    });
}
function cached() { try { return localStorage.getItem("gasUrl") || ""; } catch (e) { return ""; } }
function remember(u) { try { localStorage.setItem("gasUrl", u); } catch (e) {} }
function valid(u) { return /^https:\/\/script\.google\.com\//.test(u || ""); }

function openApp(url) {
  var f = document.getElementById("app");
  f.addEventListener("load", function () { document.getElementById("ld").classList.add("hide"); });
  /* teruskan parameter dari QR (?id=...) dan ?page=... ke web app */
  f.src = url + (location.search || "");
}
function fail() {
  document.getElementById("spn").style.display = "none";
  document.getElementById("msg").style.display = "none";
  document.getElementById("err").style.display = "block";
}
function fallback() {
  var u = cached();
  if (!valid(u)) u = GAS_URL;
  if (valid(u)) openApp(u); else fail();
}

if (/^https?:\/\//.test(CSV_URL)) {
  fromCsv().then(function (u) { remember(u); openApp(u); }).catch(fallback);
} else {
  if (valid(GAS_URL)) { remember(GAS_URL); openApp(GAS_URL); } else fail();
}
</script>
</body>
</html>
